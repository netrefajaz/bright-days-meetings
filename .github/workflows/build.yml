name: Build meetings

# Every Monday at 10:17 UTC, plus a manual run button.
on:
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download feeds and write the files
        run: node scripts/build.mjs
      - name: Save the geocode cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/geocode.json
          git diff --cached --quiet || git commit -m "Update geocode cache from weekly build"
          git pull --rebase -q && git push
      # The app reads these from raw.githubusercontent.com/netrefajaz/bright-days-meetings/data/
      # The branch keeps only the latest files, so it never grows.
      - name: Publish to the data branch
        run: |
          cd site
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Meeting data built $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
