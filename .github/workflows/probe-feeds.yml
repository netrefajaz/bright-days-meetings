name: Probe feeds

# Run by hand to test feeds/candidates.csv and refresh feeds/feeds.json.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe-feeds.mjs
      - name: Save the feed list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/feeds.json feeds/probe-failed.json
          git diff --cached --quiet || git commit -m "Update working feed list from probe run"
          git push
